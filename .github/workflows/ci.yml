name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: backend/.cache/fastembed
          key: fastembed-bge-small-bm25-v1
      - run: ruff check . && ruff format --check .
      - name: Build search index
        run: python scripts/build_index.py
      # Unit, search, agent-loop and API tests. The model is scripted, so no API key is needed.
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shop-assistant-api backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Route types (LayoutProps, PageProps) are generated, not committed
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
